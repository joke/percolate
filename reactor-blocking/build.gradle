plugins {
    id 'java'
    id 'groovy'
    id 'maven-publish'
    id 'io.freefair.lombok'
    id 'com.netflix.nebula.archrules.runner'
    id 'percolate.conventions'
    id 'info.solidsoft.pitest'
}

dependencies {
    annotationProcessor platform(project(':dependencies'))
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'com.google.auto.service:auto-service'
    annotationProcessor 'io.github.joke.jspecify:processor'

    compileOnly platform(project(':dependencies'))
    compileOnly 'com.google.auto.service:auto-service-annotations'
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.jspecify:jspecify'
    compileOnly 'org.jetbrains:annotations'
    // reactor-core is a peer dependency: any consumer of this module is already writing
    // Flux/Mono mapper code and so already depends on io.projectreactor:reactor-core itself.
    // This module must not redistribute/pin a runtime version of its own - compileOnly keeps
    // it off the published POM entirely (version supplied by the platform above, compile-time
    // only) rather than leaking an internal version choice onto every consumer.
    compileOnly 'io.projectreactor:reactor-core'

    implementation project(':spi')

    testImplementation platform(project(':dependencies'))
    testImplementation project(':processor')
    testImplementation project(':strategies-builtin')
    testImplementation project(':reactor')
    testImplementation project(':test-foundation')
    testImplementation 'com.google.testing.compile:compile-testing'
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.jspecify:jspecify'
    testImplementation 'io.projectreactor:reactor-core'
    testImplementation 'com.tngtech.archunit:archunit'

    testAnnotationProcessor platform(project(':dependencies'))
    testAnnotationProcessor 'io.github.joke.jspecify:processor'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.slf4j:slf4j-simple'
}

tasks.named('compileTestJava') {
    options.release = 17
}

tasks.named('integrationTest') {
    // ReactorBlockingDocExampleSpec materialises the manual's generated output here — see the equivalent
    // declaration in reactor/build.gradle for why an undeclared side-effect directory breaks a cache hit.
    outputs.dir layout.buildDirectory.dir('generated-doc-examples')
}
