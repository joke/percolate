pluginManagement {
    repositories {
        gradlePluginPortal()
    }
    plugins {
        id 'org.danilopianini.cpd' version '4.0.22'
        id 'org.antora' version '1.0.0'
        id 'info.solidsoft.pitest' version '1.19.0'
        id 'com.gradleup.shadow' version '9.6.1'
        id 'com.gradleup.nmcp.settings' version '1.6.1'
        id 'io.freefair.lombok' version '9.5.0'
        id 'com.netflix.nebula.archrules.library' version '1.3.1'
        id 'com.netflix.nebula.archrules.runner' version '1.3.1'
        id 'com.netflix.nebula.archrules.aggregate' version '1.3.1'
    }
}

plugins {
    id 'com.gradleup.nmcp.settings'
}

nmcpSettings {
    centralPortal {
        username = providers.gradleProperty('mavenCentralUsername')
        password = providers.gradleProperty('mavenCentralPassword')
        publishingType = 'AUTOMATIC'
    }
}

rootProject.name = 'percolate'

include 'annotations'
include 'bom'
include 'dependencies'
include 'lib:javapoet'
include 'processor'
include 'spi'
include 'strategies-builtin'
include 'reactor'
include 'reactor-blocking'
include 'percolate'
include 'test-foundation'
include 'percolate-smoke'
include 'architecture-tests'
