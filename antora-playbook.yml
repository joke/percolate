site:
  title: Percolate
  url: https://joke.github.io/percolate
  start_page: percolate::index.adoc

content:
  sources:
  # HEAD only - the manual is deliberately single-version. Release tags are NOT aggregated: the pages
  # include:: generated output that compile tests materialise into module build directories, and the
  # collector extension checks every non-HEAD ref out into a fresh worktree that has no build directories
  # and runs no build commands. A tagged version would therefore silently lose every generated include::
  # unless each tag were rebuilt on every docs run - hundreds of full Gradle builds within a few years.
  - url: .
    branches: HEAD
    start_path: docs

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  # Overlays docs/supplemental-ui/ onto the extracted bundle. The only file it replaces is
  # partials/header-content.hbs, which strips the bundle's hardcoded demo navbar (Home/Products/Services/
  # Download, all dead links) and the mobile burger that toggled it open — everything else on the bundle
  # (styles, scripts, the version-dropdown partials) stays on the stock, upstream-maintained path.
  supplemental_files: docs/supplemental-ui

antora:
  extensions:
  # Installed into Antora's Node context by the org.antora plugin's `packages` map (see build.gradle).
  # Imports module-owned example fixtures into the content catalog via `ext.collector` scan entries.
  - require: '@antora/collector-extension'

runtime:
  log:
    # Antora's default failure tolerance is `fatal`, so an ERROR-level asciidoctor message (an unresolved
    # include:: among them) was logged and the process still exited 0 — a silently incomplete site then
    # deployed to Pages. `warn` is the lowest level that covers all three failures the user-manual spec
    # requires to be fatal: unresolved include:: (ERROR), broken xref: and missing nav target (WARN).
    failure_level: warn

output:
  dir: ./build/site
