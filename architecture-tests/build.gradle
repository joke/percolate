plugins {
    id 'groovy'
    // Authors the shared rule library. The runner is deliberately NOT applied here: this module would
    // otherwise evaluate its own rules against itself, and `archRules project(':architecture-tests')`
    // would be a dependency cycle.
    id 'com.netflix.nebula.archrules.library'
    id 'percolate.conventions'
}

// This module depends on no sibling. The rules it publishes are evaluated by the runner inside each
// consuming module against that module's own classes, so nothing here needs to see another module's
// build output - which is exactly what the previous central union-classpath suite required.
dependencies {
    archRulesTestImplementation platform(project(':dependencies'))
    archRulesTestImplementation 'com.tngtech.archunit:archunit'
    archRulesTestImplementation 'org.apache.groovy:groovy'
    archRulesTestImplementation 'org.spockframework:spock-core'

    archRulesTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    archRulesTestRuntimeOnly 'org.mockito:mockito-junit-jupiter'
    archRulesTestRuntimeOnly 'org.slf4j:slf4j-simple'
}
