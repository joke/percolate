plugins {
    id 'org.danilopianini.cpd' apply false
    id 'info.solidsoft.pitest' apply false
    id 'org.antora'
    id 'io.freefair.lombok' apply false
    id 'com.netflix.nebula.archrules.aggregate'
}

// Every other project gets its repositories from percolate.conventions, which the root does not
// apply. It still needs one: nmcp adds com.gradleup.nmcp:nmcp-tasks to an 'nmcpTasks' configuration
// on every project it touches - including this one, via the aggregation plugin below - without
// providing a repository of its own. With none declared here, :nmcpCheckAggregationFiles cannot
// resolve and publishAggregationToCentralPortal fails.
repositories {
    mavenCentral()
}

// com.gradleup.nmcp.settings (applied in settings.gradle) implicitly applies
// com.gradleup.nmcp.aggregation to this root project - configure the extension it registers
// here rather than re-applying the plugin.
nmcpAggregation {
    // rootProject.name ('percolate') intentionally collides with the ':percolate' starter
    // module's own project name (no per-module artifactId prefix - see the
    // drop-percolate-artifactId-prefix design). Harmless for actual Central Portal
    // coordinates, which key off group+artifactId, not simple project name.
    allowDuplicateProjectNames.set(true)
}

// The version the manual's install snippets advertise. This is the latest RELEASED version (the nearest
// reachable tag), deliberately not project.version - on main that is a -SNAPSHOT past the tag, which must
// never appear in a "add this dependency" block. Injected as an Antora attribute rather than hardcoded in
// docs/antora.yml so there is no bump-on-release step to forget. With no tag reachable (a shallow or
// tagless clone) this stays visibly not a release rather than plausibly wrong; the deploying workflow
// checks out with fetch-depth: 0, so CI always resolves a real tag.
def latestReleaseVersion = providers.exec {
    workingDir = rootDir
    commandLine 'git', 'describe', '--tags', '--abbrev=0'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() - ~/^v/ }.getOrElse('') ?: 'UNRELEASED'

antora {
    version = '3.1.15'
    playbook = 'antora-playbook.yml'
    options = [clean: true, fetch: true, attributes: ['percolate-version': latestReleaseVersion]]
    packages = [
            '@antora/collector-extension': '1.0.3'
    ]
}

tasks.named('antora') {
    dependsOn ':strategies-builtin:integrationTest'
    dependsOn ':strategies-builtin:compileTestJava'
    dependsOn ':processor:integrationTest'
    dependsOn ':spi:integrationTest'
    dependsOn ':spi:compileTestJava'
    dependsOn ':reactor-blocking:integrationTest'
    dependsOn ':reactor:integrationTest'
}

wrapper {
    gradleVersion = '9.6.1'
}
