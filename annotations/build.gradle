plugins {
    id 'java-library'
    id 'groovy'
    id 'maven-publish'
    id 'percolate.conventions'
}

// Consumer-facing API: javadoc here is read by mapper authors and third-party strategy authors, so this module
// keeps .pmd.xml alone and is exempt from the internal javadoc ban.
percolatePublicApi = true

dependencies {
    compileOnly platform(project(':dependencies'))
    compileOnly 'org.jspecify:jspecify'

    testImplementation platform(project(':dependencies'))
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'com.google.testing.compile:compile-testing'
    testImplementation 'org.jspecify:jspecify'

    testRuntimeOnly 'net.bytebuddy:byte-buddy'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
