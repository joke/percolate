name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0. Set only to re-publish a failed release.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: joke/workflows/.github/workflows/gradle-release.yml@d19d946689bef9c7dc3a9abb3bbeca1c446489aa # v1.0.0
    with:
      tag: ${{ inputs.tag || '' }}
    secrets: inherit

  docs:
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.sha }}
        # Antora derives versions from git refs; full history + tags are required.
        fetch-depth: 0
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
    # The org.antora plugin builds the site on a managed Node; the `antora` task dependsOn the
    # doc-example specs that materialise the generated output the manual include::s.
    - run: ./gradlew antora
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: build/site

  deploy:
    needs: [release, docs]
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One concurrent Pages deployment; let an in-progress one finish rather than cancelling it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
