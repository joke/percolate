name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0. Set only to re-publish a failed release.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: joke/workflows/.github/workflows/gradle-release.yml@v1.0.0
    with:
      tag: ${{ inputs.tag || '' }}
    secrets: inherit

  docs:
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        # Antora derives versions from git refs; full history + tags are required.
        fetch-depth: 0
    - uses: jdx/mise-action@v5
    - uses: gradle/actions/setup-gradle@v6
    # The org.antora plugin builds the site on a managed Node; the `antora` task dependsOn the
    # doc-example specs that materialise the generated output the manual include::s.
    - run: ./gradlew antora
    - uses: actions/upload-pages-artifact@v5
      with:
        path: build/site

  deploy:
    needs: [release, docs]
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One concurrent Pages deployment; let an in-progress one finish rather than cancelling it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
