// This module deliberately does NOT apply com.netflix.nebula.archrules.runner. Its one source file is a
// percolate-owned overlay authored in the upstream `com.palantir.javapoet` package so it can compile against
// that API with package-private access (see the javapoet-relocation spec). Running the rule library here
// would trip the "no production class imports the unrelocated upstream JavaPoet package" rule against the
// overlay's dependencies on its own package siblings. Everything else the rules protect is absent from this
// module - it is vendored third-party code, not percolate's own.
plugins {
    id 'java-library'
    id 'com.gradleup.shadow'
    id 'maven-publish'
    id 'percolate.conventions'
}

dependencies {
    compileOnly platform(project(':dependencies'))
    compileOnly 'com.palantir.javapoet:javapoet'
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    configurations.set([project.configurations.compileClasspath])
    relocate 'com.palantir.javapoet', 'io.github.joke.percolate.lib.javapoet'
    filesMatching('com/palantir/javapoet/MethodSpec*.class') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.withType(Pmd).configureEach {
    exclude '**/com/palantir/javapoet/**'
}
tasks.withType(JavaCompile).configureEach {
    options.errorprone.excludedPaths = '.*/com/palantir/javapoet/.*'
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(tasks.shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(tasks.shadowJar)
    }
}
